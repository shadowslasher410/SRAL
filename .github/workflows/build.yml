name: Build

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-Stable"
      - "[0-9]+.[0-9]+.[0-9]+-RC"
      - "[0-9]+.[0-9]+.[0-9]+-Beta"
    paths:
      - "SRC/**"
      - "Include/**"
      - "Dep/**"
      - "Bindings/**"
      - "Examples/**"
      - "**/CMakeLists.txt"
      - "**/meson.build"
      - "meson.options"
      - "ci-requirements.in"
      - "ci-requirements.txt"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - "SRC/**"
      - "Include/**"
      - "Dep/**"
      - "Bindings/**"
      - "Examples/**"
      - "**/CMakeLists.txt"
      - "**/meson.build"
      - "meson.options"
      - "ci-requirements.in"
      - "ci-requirements.txt"
      - ".github/workflows/build.yml"

  workflow_dispatch:
    inputs:
      build_system:
        description: "Select the orchestration build engine ('cmake' or 'meson')"
        required: true
        type: choice
        default: "cmake"
        options:
          - "cmake"
          - "meson"
      build_variant:
        description: "Target build optimization matrix ('Release' or 'Debug')"
        required: false
        type: choice
        default: "Release"
        options:
          - "Release"
          - "Debug"

  workflow_call:
    inputs:
      release_version:
        description: "Dynamic version passed from release workflow"
        required: false
        type: string
        default: ""
      build_system:
        description: "Select the orchestration build engine ('cmake' or 'meson')"
        required: false
        type: string
        default: "cmake"
      build_variant:
        description: "Target build optimization matrix ('Release' or 'Debug')"
        required: false
        type: string
        default: "Release"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release_version || github.sha }}-${{ inputs.build_system || 'cmake' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_call' }}

jobs:
  validate-lockfile:
    name: Verify Hash-Locked Dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install UV Package Compiler
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Compile and Validate Lockfile Integrity
        run: |
          if [ ! -f ci-requirements.txt ]; then
            echo "ERROR: ci-requirements.txt does not exist!"
            exit 1
          fi
          uv pip compile --generate-hashes --output-file=ci-requirements.tmp ci-requirements.in
          if ! diff -u ci-requirements.txt ci-requirements.tmp; then
            echo "ERROR: Your ci-requirements.txt file is out of sync or missing cross-platform hashes!"
            echo "Please fix this locally by running:"
            echo "uv pip compile --generate-hashes --output-file=ci-requirements.txt ci-requirements.in"
            echo "Then commit and push the updated ci-requirements.txt file."
            exit 1
          fi 
          echo "Lockfile hashes validated."

  desktop:
    name: Desktop (${{ matrix.os }} - ${{ inputs.build_system || 'cmake' }} - ${{ inputs.build_variant }})
    needs: validate-lockfile
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: windows-2025
            name: windows-x64
          - os: macos-26
            name: macos-universal
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ github.workspace }}/ci-requirements.txt"

      - name: Secure and Bootstrap Pip Installer
        run: python -m pip install --upgrade pip==26.2

      - name: Install Python Package Dependencies
        run: python -m pip install --require-hashes --no-deps -r "${{ github.workspace }}/ci-requirements.txt"

      - name: Setup Visual Studio Developer Environment
        if: matrix.os == 'windows-2025'
        uses: mlocati/setup-msvc@ade6aff3df872d66c12a63dcacdddf0041cb2693 # v1.3.1
        with:
          architecture: x64

      - name: Cache Linux System APT Development Packages and Lists
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/apt-cache
          key: ${{ runner.os }}-apt-dev-packages-${{ hashFiles('ci-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-dev-packages-

      - name: Install dependencies (Linux System Headers)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ -d "${{ github.workspace }}/apt-cache/archives" ]; then
            sudo cp -r ${{ github.workspace }}/apt-cache/archives/. /var/cache/apt/archives/
            sudo cp -r ${{ github.workspace }}/apt-cache/lists/. /var/lib/apt/lists/
          fi

          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libspeechd-dev libdbus-1-dev libatspi2.0-dev brltty libbrlapi-dev ninja-build
          
          mkdir -p ${{ github.workspace }}/apt-cache/archives
          mkdir -p ${{ github.workspace }}/apt-cache/lists
          
          sudo cp -r /var/cache/apt/archives/. ${{ github.workspace }}/apt-cache/archives/
          sudo cp -r /var/lib/apt/lists/. ${{ github.workspace }}/apt-cache/lists/

      - name: Configure Project Sandbox (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_TITLE=$(echo "${INPUT_VARIANT:-Release}" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          cmake -G "Ninja" -B builddir_cmake \
            -DCMAKE_BUILD_TYPE="${VARIANT_TITLE}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DBUILD_TESTS=enabled \
            -DBUILD_BINDINGS=enabled \
            -DSRAL_INSTALL_BINDING_SOURCES=enabled

      - name: Compile and Link Targets (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        shell: bash
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          cmake --build builddir_cmake -j "$THREADS"

      - name: Install into Staging Tree (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        shell: bash
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          cmake --install builddir_cmake --component Runtime --component Development -j "$THREADS"

      - name: Configure Project Sandbox (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_LOWER=$(echo "${INPUT_VARIANT:-Release}" | tr '[:upper:]' '[:lower:]')
          meson setup builddir_meson \
            --buildtype="$VARIANT_LOWER" \
            --prefix="${{ github.workspace }}/dist" \
            -Ddefault_library=both \
            -Dwerror=true \
            -Db_lto=true \
            -Db_pie=true \
            -Db_staticpic=true \
            -DBUILD_TESTS=true \
            -DBUILD_BINDINGS=true \
            -DSRAL_INSTALL_BINDING_SOURCES=true

      - name: Compile and Link Targets (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C builddir_meson

      - name: Install into Staging Tree (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        shell: bash
        run: |
          set -euo pipefail
          meson install -C builddir_meson

      - name: Archive Consolidated Artifact Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.name }}-${{ inputs.build_system || 'cmake' }}-${{ inputs.build_variant }}
          path: "${{ github.workspace }}/dist"
          if-no-files-found: error

  android:
    name: Android (${{ matrix.abi }} - ${{ inputs.build_system || 'cmake' }} - ${{ inputs.build_variant }})
    runs-on: ubuntu-24.04
    needs: validate-lockfile
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
        include:
          - abi: arm64-v8a
            arch: aarch64
            cpu_family: aarch64
          - abi: x86_64
            arch: x86_64
            cpu_family: x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ github.workspace }}/ci-requirements.txt"

      - name: Secure and Bootstrap Pip Installer
        run: python -m pip install --upgrade pip==26.2

      - name: Install Python Package Dependencies
        run: python -m pip install --require-hashes --no-deps -r "${{ github.workspace }}/ci-requirements.txt"

      - name: Set up JetBrains Runtime JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "jetbrains"
          java-version: "21"

      - name: Set up Base Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        env:
          ACCEPT_ANDROID_SDK_LICENSES: "true"

      - name: Set up Native Linux Android NDK (r27c)
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Auto-Resolve NDK Path Variables
        id: locate-ndk
        run: |
          set -euo pipefail
          TARGET_NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"

          if [ -z "$TARGET_NDK" ]; then
            if [ -d "/opt/hostedtoolcache/ndk/r27c/x64" ]; then
              TARGET_NDK="/opt/hostedtoolcache/ndk/r27c/x64"
            elif [ -d "/usr/local/lib/android/sdk/ndk/27.2.12479018" ]; then
              TARGET_NDK="/usr/local/lib/android/sdk/ndk/27.2.12479018"
            else
              FOUND_NDK=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1 || true)
              TARGET_NDK="${FOUND_NDK:-}"
            fi
          fi

          if [ -z "$TARGET_NDK" ] || [ ! -d "$TARGET_NDK" ]; then
            echo "::error::Failed to locate Android NDK."
            exit 1
          fi
          echo "ndk_path=$TARGET_NDK" >> "$GITHUB_OUTPUT"

      - name: Configure Android Project (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        run: |
          INPUT_VARIANT="${{ inputs.build_variant }}"
          case "${INPUT_VARIANT,,}" in
            debug) CMAKE_CONFIG="Debug" ;;
            release) CMAKE_CONFIG="Release" ;;
            *) CMAKE_CONFIG="Release" ;;
          esac
                    
          cmake -G "Ninja" -B builddir_cmake \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="${{ steps.locate-ndk.outputs.ndk_path }}" \
            -DCMAKE_ANDROID_ARCH_ABI="${{ matrix.abi }}" \
            -DCMAKE_SYSTEM_VERSION=21 \
            -DCMAKE_BUILD_TYPE="${CMAKE_CONFIG}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist-android" \
            -DBUILD_TESTS=disabled \
            -DBUILD_BINDINGS=enabled

      - name: Create Android Cross File Dynamically (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        env:
          TARGET_NDK: ${{ steps.locate-ndk.outputs.ndk_path }}
          ARCH: ${{ matrix.arch }}
          ABI: ${{ matrix.abi }}
          CPU_FAM: ${{ matrix.cpu_family }}
        run: |
          set -euo pipefail
          
          case "$ARCH" in
            aarch64) TRIPLE="aarch64-linux-android" ;;
            x86_64)  TRIPLE="x86_64-linux-android" ;;
            *)       echo "::error::Unsupported architecture: $ARCH"; exit 1 ;;
          esac

          API_LEVEL="21"
          TOOLCHAIN_BIN="$TARGET_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          cat << EOF > android_cross.txt
          [constants]
          toolchain = '$TOOLCHAIN_BIN'
          triple_base = '$TRIPLE'
          api = '$API_LEVEL'

          [binaries]
          c         = toolchain + '/' + triple_base + api + '-clang'
          cpp       = toolchain + '/' + triple_base + api + '-clang++'
          ar        = toolchain + '/llvm-ar'
          strip     = toolchain + '/llvm-strip'
          pkgconfig = 'false'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = '$CPU_FAM'
          cpu = '$ARCH'
          endian = 'little'
          EOF

          echo "::group::Generated Cross File View"
          cat android_cross.txt
          echo "::endgroup::"

      - name: Configure Cross Sandbox (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_LOWER=$(echo "${INPUT_VARIANT:-Release}" | tr '[:upper:]' '[:lower:]')
          
          meson setup builddir_meson \
            --cross-file android_cross.txt \
            --buildtype="${VARIANT_LOWER}" \
            --prefix="${{ github.workspace }}/dist-android" \
            -Ddefault_library=both \
            -Dwerror=true \
            -Db_lto=true \
            -Db_staticpic=true \
            -DBUILD_TESTS=true \
            -DBUILD_BINDINGS=true \
            -DSRAL_INSTALL_BINDING_SOURCES=true

      - name: Compile Cross Targets
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          if [ "${{ inputs.build_system }}" = "meson" ]; then
            meson compile -C builddir_meson
          else
            cmake --build builddir_cmake -j "$THREADS"
          fi

      - name: Install into Staging Tree
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          if [ "${{ inputs.build_system }}" = "meson" ]; then
            meson install -C builddir_meson
          else
            cmake --install builddir_cmake --component Runtime --component PlatformAssets -j "$THREADS"
          fi

      - name: Archive Android Artifact Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-android-${{ matrix.abi }}-${{ inputs.build_system || 'cmake' }}-${{ inputs.build_variant }}
          path: "${{ github.workspace }}/dist-android"
          if-no-files-found: error

  ios:
    name: iOS Framework (macos-26 - ${{ inputs.build_system || 'cmake' }} - ${{ inputs.build_variant }})
    runs-on: macos-26
    needs: validate-lockfile
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ github.workspace }}/ci-requirements.txt"

      - name: Secure and Bootstrap Pip Installer
        run: python -m pip install --upgrade pip==26.2

      - name: Install Python Package Dependencies
        run: python -m pip install --require-hashes --no-deps -r "${{ github.workspace }}/ci-requirements.txt"
        
      - name: Install Compiler Cache Binary
        run: |
          brew install ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache"

      - name: Cache C/C++ Compilation Objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-ccache-ios-${{ hashFiles('SRC/**', 'Include/**', 'Dep/**', 'Bindings/**', 'Examples/**', 'ci-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-ios-

      - name: Initialize Ccache Settings
        run: ccache --max-size=500M

      - name: Configure and Compile iOS Architectures (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          INPUT_VARIANT="${{ inputs.build_variant }}"
          CMAKE_CONFIG=$(echo "${INPUT_VARIANT:-Release}" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          
          cmake -G "Ninja" -B build_device_cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE="${CMAKE_CONFIG}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging/device" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_device_cmake -j "$THREADS"
          cmake --install build_device_cmake

          cmake -G "Ninja" -B build_sim_cmake \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE="${CMAKE_CONFIG}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/staging/simulator" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build_sim_cmake -j "$THREADS"
          cmake --install build_sim_cmake

      - name: Create iOS Cross Files Dynamically (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          SDK_OS_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_SIM_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)

          cat << EOF > ios_device_cross.txt
          [binaries]
          c     = ['clang', '-target', 'arm64-apple-ios15.0', '-isysroot', '$SDK_OS_PATH']
          cpp   = ['clang++', '-target', 'arm64-apple-ios15.0', '-isysroot', '$SDK_OS_PATH']
          ar    = 'ar'
          strip = 'strip'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

          cat << EOF > ios_sim_arm64_cross.txt
          [binaries]
          c     = ['clang', '-target', 'arm64-apple-ios15.0-simulator', '-isysroot', '$SDK_SIM_PATH']
          cpp   = ['clang++', '-target', 'arm64-apple-ios15.0-simulator', '-isysroot', '$SDK_SIM_PATH']
          ar    = 'ar'
          strip = 'strip'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

          cat << EOF > ios_sim_x86_64_cross.txt
          [binaries]
          c     = ['clang', '-target', 'x86_64-apple-ios15.0-simulator', '-isysroot', '$SDK_SIM_PATH']
          cpp   = ['clang++', '-target', 'x86_64-apple-ios15.0-simulator', '-isysroot', '$SDK_SIM_PATH']
          ar    = 'ar'
          strip = 'strip'
          [properties]
          needs_exe_wrapper = true
          [host_machine]
          system = 'darwin'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

      - name: Configure and Compile iOS Architectures (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_LOWER=$(echo "${INPUT_VARIANT:-Release}" | tr '[:upper:]' '[:lower:]')
          
          meson setup build_device_meson --cross-file ios_device_cross.txt --buildtype="$VARIANT_LOWER" --ccache --prefix="${{ github.workspace }}/staging/device"
          meson compile -C build_device_meson
          meson install -C build_device_meson

          meson setup build_sim_arm64_meson --cross-file ios_sim_arm64_cross.txt --buildtype="$VARIANT_LOWER" --ccache --prefix="${{ github.workspace }}/staging/sim_arm64"
          meson compile -C build_sim_arm64_meson
          meson install -C build_sim_arm64_meson

          meson setup build_sim_x86_64_meson --cross-file ios_sim_x86_64_cross.txt --buildtype="$VARIANT_LOWER" --ccache --prefix="${{ github.workspace }}/staging/sim_x86_64"
          meson compile -C build_sim_x86_64_meson
          meson install -C build_sim_x86_64_meson

      - name: Assemble Apple XCFramework Architecture Staging Bundle
        run: |
          set -euo pipefail
          STAGING_DIR="${{ github.workspace }}/dist"
          rm -rf "${STAGING_DIR}" "${{ github.workspace }}/final_staging"
          
          mkdir -p "${STAGING_DIR}/device/headers" "${STAGING_DIR}/simulator/headers" "${{ github.workspace }}/final_staging"

          if [ "${{ inputs.build_system }}" = "meson" ]; then
            cp -rf ${{ github.workspace }}/staging/device/include/. "${STAGING_DIR}/device/headers/"
            cp -rf ${{ github.workspace }}/staging/sim_arm64/include/. "${STAGING_DIR}/simulator/headers/"
            
            cp -f ${{ github.workspace }}/staging/device/lib/libSRAL.a "${STAGING_DIR}/device/libSRAL.a"
            lipo -create \
              "${{ github.workspace }}/staging/sim_arm64/lib/libSRAL.a" \
              "${{ github.workspace }}/staging/sim_x86_64/lib/libSRAL.a" \
              -output "${STAGING_DIR}/simulator/libSRAL.a"
          else
            cp -rf ${{ github.workspace }}/staging/device/include/. "${STAGING_DIR}/device/headers/"
            cp -rf ${{ github.workspace }}/staging/simulator/include/. "${STAGING_DIR}/simulator/headers/"
            
            cp -f ${{ github.workspace }}/staging/device/lib/libSRAL.a "${STAGING_DIR}/device/libSRAL.a"
            cp -f ${{ github.workspace }}/staging/simulator/lib/libSRAL.a "${STAGING_DIR}/simulator/libSRAL.a"
          fi

          xcodebuild -create-xcframework \
            -library "${STAGING_DIR}/device/libSRAL.a" \
            -headers "${STAGING_DIR}/device/headers" \
            -library "${STAGING_DIR}/simulator/libSRAL.a" \
            -headers "${STAGING_DIR}/simulator/headers" \
            -output "${{ github.workspace }}/final_staging/SRAL.xcframework"

          ccache --show-stats

      - name: Archive iOS XCFramework Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-ios-xcframework-${{ inputs.build_system || 'cmake' }}-${{ inputs.build_variant }}
          path: "${{ github.workspace }}/final_staging"
          if-no-files-found: error

  webassembly:
    name: WebAssembly (${{ inputs.build_system || 'cmake' }} - ${{ inputs.build_variant }})
    runs-on: ubuntu-24.04
    needs: validate-lockfile
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "${{ github.workspace }}/ci-requirements.txt"

      - name: Secure and Bootstrap Pip Installer
        run: python -m pip install --upgrade pip==26.2

      - name: Install Python Package Dependencies
        run: python -m pip install --require-hashes --no-deps -r "${{ github.workspace }}/ci-requirements.txt"

      - name: Install and Initialize Compiler Cache Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache"

      - name: Cache WebAssembly C/C++ Compilation Objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-wasm-${{ hashFiles('SRC/**', 'Include/**', 'Dep/**', 'Bindings/**', 'Examples/**', 'ci-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-wasm-

      - name: Configure Ccache Max Limit Bounds
        run: ccache --max-size=500M

      - name: Setup Emscripten Toolchain
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.0
          actions-cache-folder: "emsdk-cache"

      - name: Verify EMSDK Local Environment Setup
        run: emcc -v

      - name: Configure and Compile WASM Targets (CMake Engine)
        if: ${{ inputs.build_system == 'cmake' || inputs.build_system == '' }}
        run: |
          set -euo pipefail
          THREADS=$(python -c 'import os; print(os.cpu_count() or 4)')
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_TITLE=$(echo "${INPUT_VARIANT:-Release}" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          
          emcmake cmake -G "Ninja" -B builddir_cmake \
            -DCMAKE_BUILD_TYPE="${VARIANT_TITLE}" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=disabled \
            -DBUILD_BINDINGS=enabled \
            -DSRAL_WITH_CHROMEVOX=enabled
            
          cmake --build builddir_cmake -j "$THREADS"
          cmake --install builddir_cmake

      - name: Create WebAssembly Cross File (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          if [ -z "${EMSDK:-}" ] || [ ! -d "${EMSDK}/upstream/emscripten" ]; then
            echo "::error::EMSDK root tracking block could not be accurately mapped."
            exit 1
          fi

          cat << EOF > emscripten_cross.txt
          [binaries]
          c     = 'emcc'
          cpp   = 'em++'
          ar    = 'emar'
          strip = 'emstrip'

          [built-in options]
          c_args        = ['-fstack-protector-all', '-ftrivial-auto-var-init=zero', '-Werror', '-pthread', '-Qunused-arguments']
          cpp_args      = ['-fstack-protector-all', '-ftrivial-auto-var-init=zero', '-Werror', '-pthread', '-Qunused-arguments']
          c_link_args   = ['-pthread', '-sSTACK_OVERFLOW_CHECK=2', '-sASSERTIONS=1', '-sWASM_BIGINT']
          cpp_link_args = ['-pthread', '-sSTACK_OVERFLOW_CHECK=2', '-sASSERTIONS=1', '-sWASM_BIGINT']

          [host_machine]
          system = 'emscripten'
          cpu_family = 'wasm32'
          cpu = 'wasm32'
          endian = 'little'
          EOF

      - name: Configure WebAssembly Cross Compilation Pass (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          INPUT_VARIANT="${{ inputs.build_variant }}"
          VARIANT_LOWER=$(echo "${INPUT_VARIANT:-Release}" | tr '[:upper:]' '[:lower:]')
          
          meson setup builddir_meson \
            --cross-file emscripten_cross.txt \
            --buildtype="$VARIANT_LOWER" \
            --ccache \
            --prefix="${{ github.workspace }}/dist" \
            -Ddefault_library=static \
            -Dwerror=true \
            -Db_lto=true \
            -Db_pie=false \
            -Db_staticpic=true \
            -DSRAL_WITH_CHROMEVOX=true \
            -DSRAL_INSTALL_BINDING_SOURCES=true

      - name: Compile and Install WebAssembly Assets (Meson Engine)
        if: ${{ inputs.build_system == 'meson' }}
        run: |
          set -euo pipefail
          meson compile -C builddir_meson
          meson install -C builddir_meson

      - name: Report Cache Aggregation Metrics
        run: ccache --show-stats

      - name: Archive WebAssembly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-wasm-${{ inputs.build_system || 'cmake' }}-${{ inputs.build_variant }}
          path: "${{ github.workspace }}/dist"
          if-no-files-found: error
