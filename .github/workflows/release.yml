name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-Stable"
      - "[0-9]+.[0-9]+.[0-9]+-RC"
      - "[0-9]+.[0-9]+.[0-9]+-Beta"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/release name to publish (e.g. 1.0.0-Stable)"
        required: true
        type: string
      build_system:
        description: "Select the orchestration build engine"
        required: true
        type: choice
        default: "cmake"
        options:
          - "cmake"
          - "meson"

permissions:
  contents: write
  id-token: write

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.determine-tag.outputs.version }}
      build_variant: ${{ steps.determine-tag.outputs.variant }}
      build_system: ${{ steps.determine-tag.outputs.engine }}
    steps:
      - name: Parse and Validate Target Tag Structure
        id: determine-tag
        run: |
          set -euo pipefail

          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Processing structural review for version token: ${RAW_VERSION}"

          if [[ ! "${RAW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(Stable|RC|Beta)$ ]]; then
            echo "::error::Provided version string '${RAW_VERSION}' does not adhere to semantic format (Major.Minor.Patch-Stable/RC/Beta)."
            exit 1
          fi

          # Safe Title-Case Normalization Matrix for Flawless Downstream Artifact Fetching
          if [[ "${RAW_VERSION}" == *-Stable || "${RAW_VERSION}" == *-RC ]]; then
            VARIANT_TOKEN="Release"
          else
            VARIANT_TOKEN="Debug"
          fi

          SELECTED_ENGINE="${{ github.event.inputs.build_system || 'cmake' }}"

          echo "version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "engine=${SELECTED_ENGINE}" >> "$GITHUB_OUTPUT"

  setup:
    needs: validate-version
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ needs.validate-version.outputs.release_version }}
      build_system: ${{ needs.validate-version.outputs.build_system }}
      build_variant: ${{ needs.validate-version.outputs.build_variant }}

  hash-package-release:
    name: Package and Checksum Release Target (${{ matrix.target-name }})
    needs: [validate-version, setup]
    runs-on: ${{ matrix.runner-os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-name: windows-x64
            artifact-name: bundle-windows-x64
            runner-os: windows-2025
            output-archive: SRAL-Windows.zip
          - target-name: linux-x64
            artifact-name: bundle-linux-x64
            runner-os: ubuntu-24.04
            output-archive: SRAL-Linux.tar.gz
          - target-name: macos-universal
            artifact-name: bundle-macos-universal
            runner-os: macos-26
            output-archive: SRAL-macOS.zip
          - target-name: wasm-framework
            artifact-name: bundle-wasm
            runner-os: ubuntu-24.04
            output-archive: SRAL-WebAssembly.zip
          - target-name: android-arm64
            artifact-name: bundle-android-arm64-v8a
            runner-os: ubuntu-24.04
            output-archive: SRAL-Android-arm64.tar.gz
          - target-name: android-x86_64
            artifact-name: bundle-android-x86_64
            runner-os: ubuntu-24.04
            output-archive: SRAL-Android-x86_64.tar.gz
          - target-name: ios-framework
            artifact-name: bundle-ios-xcframework
            runner-os: macos-26
            output-archive: SRAL-iOS-XCFramework.zip
    steps:
      - name: Fetch Compiled Pre-Release Binary Packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ matrix.artifact-name }}-${{ needs.validate-version.outputs.build_system }}-${{ needs.validate-version.outputs.build_variant }}"
          path: staging_dist

      - name: Package Release Assets (Windows)
        if: matrix.runner-os == 'windows-2025'
        shell: powershell
        run: Compress-Archive -Path staging_dist/* -DestinationPath ${{ matrix.output-archive }}

      - name: Package Release Assets (Linux & Android)
        if: matrix.runner-os == 'ubuntu-24.04' && matrix.target-name != 'wasm-framework'
        shell: bash
        run: tar -czvf ${{ matrix.output-archive }} -C staging_dist .

      - name: Package Release Assets (macOS, iOS & WebAssembly)
        if: matrix.runner-os == 'macos-26' || matrix.target-name == 'wasm-framework'
        shell: bash
        run: |
          cd staging_dist
          zip -r ../${{ matrix.output-archive }} .
          cd ..

      - name: Generate SHA-256 Checksum (Windows - Standard Cross-Platform Format Fixed)
        if: matrix.runner-os == 'windows-2025'
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path "${{ matrix.output-archive }}" -Algorithm SHA256).Hash.ToLower()
          # Output is strictly normalized to match standard Unix format spacing vectors perfectly
          set-content -path "${{ matrix.output-archive }}.sha256" -value "$hash  ${{ matrix.output-archive }}" -NoNewline

      - name: Generate SHA-256 Checksum (Linux & macOS)
        if: matrix.runner-os != 'windows-2025'
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.output-archive }}" > "${{ matrix.output-archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.output-archive }}" > "${{ matrix.output-archive }}.sha256"
          fi

      - name: Stash Processed Release Assets Locally
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upload-ready-${{ matrix.target-name }}
          path: |
            ${{ matrix.output-archive }}
            ${{ matrix.output-archive }}.sha256
          retention-days: 1

  publish-release-gate:
    name: Consolidate and Publish Final GitHub Release
    needs: [validate-version, hash-package-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Create Final Collection Directory
        run: mkdir final_release_payload

      - name: Collect All Packaged Assets from Matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upload-ready-*
          path: final_release_payload
          merge-multiple: true

      - name: Deploy Consolidated Package Matrix Release Target
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_version }}
          name: Release ${{ needs.validate-version.outputs.release_version }}
          prerelease: ${{ contains(needs.validate-version.outputs.release_version, '-Beta') || contains(needs.validate-version.outputs.release_version, '-RC') }}
          make_latest:  ${{ contains(needs.validate-version.outputs.release_version, '-Stable') }}
          files: final_release_payload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}