[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sral"
version = "1.0.0"
description = "Python ctypes bindings for the Screen Reader Abstraction Library (SRAL)"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Accessibility",
]
dependencies = []

[tool.setuptools]
py-modules = ["sral"]

[tool.setuptools.package-data]
"*" = ["*.dll", "*.so", "*.dylib"]
